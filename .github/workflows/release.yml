name: Release

# Tags publish stable releases; every main commit publishes a distinct nightly.
# The build job holds a read-only token and uploads the DMG as a workflow artifact; the publish
# job (the only one with write access) re-verifies it and then publishes. Publishing happens only
# from main or v* tags; manual dispatch is accepted from main only.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BUILD_CHANNEL: ${{ github.ref_type == 'tag' && 'stable' || github.ref_name == 'main' && 'nightly' || 'dev' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        run: |
          version="$(cat VERSION)"
          # Info.plist is a template; make-app-bundle.sh resolves @VERSION@ from VERSION.
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          test "$plist_version" = '@VERSION@'
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo '::error::Release tag must match VERSION and the bundle version.'
            exit 1
          fi
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Run tests
        run: |
          swift test
          python3 -m unittest discover -s scripts/tests -v
      # Only this job receives the signing secrets, and only through this step's environment. With
      # neither secret set the build stays ad-hoc signed and a warning is shown; a partial or broken
      # configuration fails the job instead of silently downgrading. The script exports SIGN_IDENTITY
      # (the certificate hash) and EXPECT_SIGNED_IDENTITY, which build-release.sh and verify-dmg.sh use.
      - name: Import signing identity
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: scripts/import-signing-identity.sh
      - name: Build and verify DMG
        run: scripts/build-release.sh
      - name: Confirm signing identity
        run: |
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            echo "Signed with the stable identity (expected: ${EXPECT_SIGNED_IDENTITY})."
          else
            echo '::warning::This build is ad-hoc signed; it will need new macOS permission grants after every update.'
          fi
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
            rm -f "$RUNNER_TEMP/macpocketknife-signing.p12"
          fi
      - name: Check built release version
        if: github.ref_type == 'tag'
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'build/MacPocketKnife.app/Contents/Info.plist')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Disk usage after build
        if: always()
        run: df -h /
      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish-nightly:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: release-nightly
      cancel-in-progress: false
    env:
      KEEP_NIGHTLIES: ${{ vars.KEEP_NIGHTLIES || '1' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist
      - name: Re-verify downloaded DMG
        run: |
          scripts/verify-dmg.sh dist/*.dmg
          (cd dist && shasum -a 256 -c ./*.sha256)
      - name: Publish nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-nightly.sh

  publish-stable:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-stable-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tagged commit on main with passing CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo '::error::Stable releases are published from v* tags only.'; exit 1 ;; esac
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not an ancestor of origin/main; refusing to publish."
            exit 1
          fi
          passed="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success \
            --json conclusion --jq 'length')"
          if [ "${passed:-0}" -lt 1 ]; then
            echo "::error::The CI workflow has not concluded successfully for $GITHUB_SHA; refusing to publish."
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist
      - name: Re-verify downloaded DMG
        run: |
          scripts/verify-dmg.sh dist/*.dmg
          (cd dist && shasum -a 256 -c ./*.sha256)
          test -f "dist/MacPocketKnife-${GITHUB_REF_NAME#v}.dmg"
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev_tag="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo 'Signed with a self-signed certificate (or ad-hoc), not notarized. Install with Homebrew (brew install --cask fperdigon/tap/macpocketknife) or see the README for the first-launch steps (System Settings > Privacy & Security > Open Anyway).'
            echo
            if [ -n "$prev_tag" ]; then
              echo "## Changes since $prev_tag"
            else
              echo '## Changes'
            fi
            echo
            scripts/release-notes.sh "$prev_tag" "$GITHUB_REF_NAME"
            if [ -n "$prev_tag" ]; then
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_REF_NAME}"
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
      - name: Notify Homebrew tap
        if: github.ref_type == 'tag'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo '::notice::HOMEBREW_TAP_TOKEN is not set; the Homebrew tap will pick up this release on its daily run.'
            exit 0
          fi

          version="${GITHUB_REF_NAME#v}"
          if response="$(GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api --include \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            repos/fperdigon/homebrew-tap/dispatches \
            -f event_type=macpocketknife-release -f "client_payload[version]=$version" 2>&1)"; then
            echo '::notice::Homebrew tap notified successfully.'
            exit 0
          fi

          status="$(printf '%s\n' "$response" | sed -nE 's/^(HTTP\/[^ ]+ [0-9]{3}.*)$/\1/p' | head -n 1)"
          if [ -z "$status" ]; then
            status='HTTP status unavailable'
          fi
          message="$(printf '%s\n' "$response" | sed '1,/^[[:space:]]*$/d' | sed '/^[[:space:]]*$/d' | tr -d '\r' | tail -n 1 | cut -c1-300)"
          if [ -z "$message" ]; then
            message="$(printf '%s\n' "$response" | sed '/^[[:space:]]*$/d' | tr -d '\r' | tail -n 1 | cut -c1-300)"
          fi
          if [ -z "$message" ]; then
            message='API error message unavailable'
          fi
          echo "::warning::Homebrew tap dispatch failed ($status): $message; the tap will pick up this release on its daily run."
          exit 0
