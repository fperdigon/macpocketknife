name: Codec probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/screenrec/codec-probe.swift
      - .github/workflows/codec-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Runner hardware
        run: sw_vers; system_profiler SPDisplaysDataType SPHardwareDataType | head -60
      - name: Compile and probe codecs
        run: |
          swiftc -swift-version 6 -target "$(uname -m)-apple-macosx13.0" scripts/screenrec/codec-probe.swift -o /tmp/codec-probe
          /tmp/codec-probe 2>&1 | tee probe.log
          cat probe.log >> "$GITHUB_STEP_SUMMARY"
